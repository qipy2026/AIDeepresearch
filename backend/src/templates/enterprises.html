<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业管理 - 贷后监管</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; }
.header { background: linear-gradient(135deg, #1e293b, #334155); color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 700; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }

/* 项目卡片 */
.project-card { background: #fff; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden; }
.project-header { padding: 20px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #f1f5f9; }
.project-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.project-icon.debtor { background: #fef3c7; }
.project-body { padding: 16px 24px 20px; }
.project-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
.project-row + .project-row { border-top: 1px solid #f8fafc; }
.project-name { font-weight: 600; font-size: 14px; }
.project-meta { font-size: 12px; color: #64748b; display: flex; gap: 12px; margin-top: 2px; }
.tag { display: inline-flex; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.tag-debtor { background: #fef3c7; color: #92400e; }
.tag-party-a { background: #dbeafe; color: #1e40af; }
.tag-parent { background: #fce7f3; color: #9d174d; }
.tag-stock { background: #dcfce7; color: #166534; }

/* 甲方行（缩进） */
.party-row { margin-left: 40px; padding: 8px 14px; background: #f8fafc; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.party-row + .party-row { margin-top: 6px; }
.party-row .arrow { color: #94a3b8; font-size: 14px; margin-right: 4px; }

/* 表单 */
.add-card { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.add-card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-field { flex: 1; min-width: 180px; }
.form-field label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
.form-field input, .form-field select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
.form-field input:focus, .form-field select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.form-field .hint { font-size: 10px; color: #94a3b8; margin-top: 2px; }

.btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: .15s; }
.btn-primary { background: linear-gradient(135deg,#2563eb,#7c3aed); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; cursor: pointer; }
.btn-ghost { background: none; border: 1px solid #cbd5e1; color: #64748b; }
.empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

.msg { padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }
.msg.ok { display: block; background: #dcfce7; color: #166534; }
.msg.err { display: block; background: #fee2e2; color: #991b1b; }

a.back { color: #93c5fd; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <span>🏢</span><h1>企业管理</h1>
  <span style="flex:1"></span>
  <a class="back" href="/warnings">← 预警中心</a>
</div>

<div class="container">
  <!-- 项目列表（卡片式） -->
  <div id="projectList"></div>

  <!-- 新增 -->
  <div class="add-card">
    <h2>➕ 新增企业</h2>
    <form id="addForm" onsubmit="addEnterprise(event)">
      <div class="form-row">
        <div class="form-field">
          <label>角色 *</label>
          <select id="role" onchange="onRoleChange()">
            <option value="乙方">乙方 - 债务企业</option>
            <option value="甲方">甲方 - 核心监管企业</option>
          </select>
        </div>
        <div class="form-field" style="flex:2">
          <label>企业全称 *</label>
          <input id="name" placeholder="如：四川振海保安服务有限公司" required>
        </div>
        <div class="form-field">
          <label>所属行业</label>
          <input id="industry" placeholder="安保服务">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field" id="debtorField" style="display:none">
          <label>关联的债务企业（乙方）</label>
          <input id="debtor" placeholder="属于哪个贷款项目">
        </div>
        <div class="form-field" id="loanField">
          <label>贷款金额（万元）</label>
          <input id="loanAmount" type="number" placeholder="1000" step="0.01">
        </div>
        <div class="form-field" id="parentField" style="display:none">
          <label>母公司</label>
          <input id="parent" placeholder="如：中国铁建">
          <div class="hint">有则填，无风险时可追溯</div>
        </div>
        <div class="form-field" id="stockField" style="display:none">
          <label>母公司股票/概念代码</label>
          <input id="parentStockCode" placeholder="601186.SH 或 885692.TI">
          <div class="hint">上市公司填股票代码，否则填概念指数</div>
        </div>
        <div class="form-field">
          <label>搜索关键词</label>
          <input id="keywords" placeholder="四川振海, 振海保安">
          <div class="hint">逗号分隔，用于舆情搜索</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">新增</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8080';

function onRoleChange() {
  const isA = document.getElementById('role').value === '甲方';
  document.getElementById('debtorField').style.display = isA ? '' : 'none';
  document.getElementById('parentField').style.display = isA ? '' : 'none';
  document.getElementById('stockField').style.display = isA ? '' : 'none';
  document.getElementById('loanField').style.display = isA ? 'none' : '';
}

async function addEnterprise(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value.trim(),
    role: document.getElementById('role').value,
    industry: document.getElementById('industry').value.trim(),
    loan_amount: document.getElementById('loanAmount').value.trim(),
    keywords: document.getElementById('keywords').value.trim(),
    debtor: document.getElementById('debtor').value.trim(),
    parent: document.getElementById('parent').value.trim(),
    parent_stock_code: document.getElementById('parentStockCode').value.trim(),
  };
  if (!data.name) { showMsg('请输入企业全称', 'err'); return; }
  try {
    const resp = await fetch(API + '/api/enterprises', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    const r = await resp.json();
    if (r.status === 'ok') { showMsg(`✅ ${data.name} 已添加`, 'ok'); document.getElementById('addForm').reset(); onRoleChange(); loadProjects(); }
    else { showMsg(r.detail || '失败', 'err'); }
  } catch(err) { showMsg('网络错误', 'err'); }
}

async function deleteEnterprise(name) {
  if (!confirm(`删除 ${name}？`)) return;
  await fetch(API + '/api/enterprises/' + encodeURIComponent(name), { method: 'DELETE' });
  loadProjects();
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + type;
  setTimeout(() => m.className = 'msg', 3000);
}

// ── 项目视图（乙方 + 下级甲方）──
async function loadProjects() {
  const resp = await fetch(API + '/api/enterprises');
  const data = await resp.json();
  const all = data.enterprises || [];
  const debtors = all.filter(e => e.role === '乙方');
  const parties = all.filter(e => e.role === '甲方');

  if (!all.length) {
    document.getElementById('projectList').innerHTML = '<div class="empty"><div class="icon">📋</div><p>暂无企业，请添加</p></div>';
    return;
  }

  let html = '';
  debtors.forEach(d => {
    const linked = parties.filter(p => p.debtor === d.name);
    html += `<div class="project-card">
      <div class="project-header">
        <div class="project-icon debtor">🏢</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:15px;">${d.name}
            <span class="tag tag-debtor">乙方·债务企业</span>
          </div>
          <div class="project-meta">
            ${d.industry ? `<span>🏭 ${d.industry}</span>` : ''}
            ${d.loan_amount ? `<span>💰 ${d.loan_amount}万元</span>` : ''}
            <span>甲方 ${linked.length} 家</span>
          </div>
        </div>
        <button class="btn btn-sm" onclick="deleteEnterprise('${d.name.replace(/'/g,"\\'")}')">删除</button>
      </div>
      <div class="project-body">
        ${linked.length ? linked.map(p => `
          <div class="party-row">
            <div>
              <span class="arrow">└</span>
              <span class="project-name">${p.name}</span>
              <span class="tag tag-party-a">甲方</span>
              ${p.parent ? `<span class="tag tag-parent">母公司 ${p.parent}</span>` : ''}
              ${p.parent_stock_code ? `<span class="tag tag-stock">${p.parent_stock_code}</span>` : ''}
              <div class="project-meta" style="margin-left:18px;">🏭 ${p.industry||'未填'}</div>
            </div>
            <button class="btn btn-sm" onclick="deleteEnterprise('${p.name.replace(/'/g,"\\'")}')">删除</button>
          </div>
        `).join('') : '<div class="party-row" style="color:#94a3b8;">暂无关联甲方，请添加</div>'}
        ${d.core_parties && d.core_parties.length ? '' : ''}
      </div>
    </div>`;
  });

  // 未关联的甲方
  const unlinked = parties.filter(p => !p.debtor);
  if (unlinked.length) {
    html += `<div class="project-card" style="opacity:0.7;">
      <div class="project-header">
        <div style="font-weight:700;font-size:15px;color:#64748b;">📋 未关联的甲方（${unlinked.length}家）</div>
      </div>
      <div class="project-body">
        ${unlinked.map(p => `
          <div class="party-row">
            <div>
              <span class="project-name">${p.name}</span>
              <span class="tag tag-party-a">甲方</span>
              ${p.parent ? `<span class="tag tag-parent">母公司 ${p.parent}</span>` : ''}
            </div>
            <button class="btn btn-sm" onclick="deleteEnterprise('${p.name.replace(/'/g,"\\'")}')">删除</button>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  document.getElementById('projectList').innerHTML = html;
}

onRoleChange();
loadProjects();
</script>
</body>
</html>
