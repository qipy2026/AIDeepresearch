<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贷款项目管理 - 贷后监管</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; }
.header { background: linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:14px 28px; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:18px; font-weight:700; }
.nav-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; transition: all .2s; white-space: nowrap; }
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
.nav-link.current { color: #fff; background: rgba(255,255,255,0.15); font-weight: 700; }

a.back { color:#93c5fd; font-size:13px; text-decoration:none; }
.container { max-width:960px; margin:0 auto; padding:24px; }

/* 项目网格 */
.projects-grid { display:flex; flex-direction:column; gap:20px; }
.project-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; border-left:4px solid #e2e8f0; }
.project-card:nth-child(1) { border-left-color:#3b82f6; }
.project-card:nth-child(2) { border-left-color:#8b5cf6; }
.project-card:nth-child(3) { border-left-color:#06b6d4; }
.project-card:nth-child(4) { border-left-color:#f59e0b; }
.project-card:nth-child(5) { border-left-color:#10b981; }
.project-card:nth-child(6) { border-left-color:#ef4444; }
.project-card:nth-child(7) { border-left-color:#ec4899; }
.project-card:nth-child(8) { border-left-color:#6366f1; }

.project-head { padding:18px 22px; display:flex; align-items:center; gap:14px; cursor:pointer; user-select:none; }
.project-head:hover { background:#fafbfc; }
.project-body { padding:0 22px 16px 22px; border-top:1px solid #f1f5f9; display:none; }
.project-card.open .project-body { display:block; }
.project-head .num { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff; }
.project-head .info { flex:1; }
.project-head .info .name { font-weight:700; font-size:15px; }
.project-head .info .meta { font-size:12px; color:#64748b; display:flex; gap:12px; margin-top:3px; }
/* 甲方行 */
.party-row { margin-left:36px; padding:10px 14px; background:#f8fafc; border-radius:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.party-row + .party-row { margin-top:6px; }
.party-row .arrow { color:#94a3b8; margin-right:4px; }

.tag { display:inline-flex; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
.tag-debtor { background:#fef3c7; color:#92400e; }
.tag-party-a { background:#dbeafe; color:#1e40af; }
.tag-parent { background:#fce7f3; color:#9d174d; }
.tag-stock { background:#dcfce7; color:#166534; }

.btn-sm { padding:4px 10px; font-size:11px; border-radius:6px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; cursor:pointer; }

/* 新建项目表单 */
.add-card { background:#fff; border-radius:14px; padding:22px 24px; box-shadow:0 2px 12px rgba(0,0,0,.06); border:2px dashed #cbd5e1; }
.add-card h2 { font-size:16px; margin-bottom:16px; }
.form-section { margin-bottom:14px; padding:14px; background:#f8fafc; border-radius:10px; }
.form-section h3 { font-size:13px; font-weight:700; margin-bottom:10px; color:#475569; display:flex; align-items:center; gap:6px; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; }
.form-field { flex:1; min-width:160px; }
.form-field label { display:block; font-size:11px; font-weight:600; color:#94a3b8; margin-bottom:3px; }
.form-field input, .form-field select { width:100%; padding:7px 10px; border:1px solid #e2e8f0; border-radius:7px; font-size:13px; background:#fff; }
.form-field input:focus, .form-field select:focus { outline:none; border-color:#3b82f6; }
.hint { font-size:10px; color:#cbd5e1; margin-top:2px; }

.btn { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.btn-primary { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; }
.btn-primary:hover { opacity:.9; }
.btn-outline { background:transparent; border:1px solid #e2e8f0; color:#64748b; }
.btn-outline:hover { border-color:#3b82f6; color:#3b82f6; }

.msg { padding:8px 14px; border-radius:8px; font-size:13px; margin-top:10px; display:none; }
.msg.ok { display:block; background:#dcfce7; color:#166534; }
.msg.err { display:block; background:#fee2e2; color:#991b1b; }
.empty { text-align:center; padding:60px 20px; color:#94a3b8; }
</style>
</head>
<body>

<div class="header"><span>🏢</span><h1>贷款项目管理</h1>  <span style="flex:1"></span>
  <a href="/warnings" class="nav-link ">预警中心</a>
  <a href="/enterprises" class="nav-link current">贷款项目</a>
  <a href="/sources" class="nav-link ">数据源管理</a>
  <a href="/rag/upload" class="nav-link ">参考文档</a>
</div>

<div class="container">
  <!-- 快捷操作 -->
  <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;">
    <button class="btn btn-primary" onclick="toggleAddForm()" id="addBtn">➕ 新建项目</button>
    <button class="btn btn-outline" onclick="toggleAll()" style="font-size:12px;">展开/折叠全部</button>
    <span style="font-size:12px;color:#94a3b8;margin-left:8px;" id="totalInfo"></span>
  </div>

  <!-- 新建项目（默认折叠） -->
  <div class="add-card" id="addCard" style="display:none;">
    <h2>➕ 新建贷款项目</h2>

    <div class="form-section">
      <h3>🏢 乙方 — 债务企业（借款方）</h3>
      <div class="form-row">
        <div class="form-field" style="flex:2"><label>企业全称 *</label><input id="debtorName" placeholder="如：四川振海保安服务有限公司"></div>
        <div class="form-field"><label>行业</label><input id="debtorIndustry" placeholder="安保服务"></div>
        <div class="form-field"><label>贷款金额(万元)</label><input id="debtorAmount" type="number" placeholder="1000"></div>
        <div class="form-field" style="flex:2"><label>搜索关键词</label><input id="debtorKW" placeholder="逗号分隔"></div>
      </div>
    </div>

    <div class="form-section">
      <h3>📋 甲方 — 核心监管企业（可添加多个）</h3>
      <div class="form-row">
        <div class="form-field" style="flex:2"><label>企业全称 *</label><input id="partyName" placeholder="国家管网集团西南管道有限责任公司"></div>
        <div class="form-field"><label>行业</label><input id="partyIndustry" placeholder="管道运输"></div>
        <div class="form-field"><label>母公司</label><input id="partyParent" placeholder="国家管网集团"></div>
        <div class="form-field"><label>股票/概念代码</label><input id="partyStock" placeholder="601186.SH或885692.TI"></div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
        <button type="button" class="btn btn-outline" onclick="addParty()">+ 添加此甲方</button>
        <span style="font-size:12px;color:#94a3b8;" id="partyCount">已添加 0 个甲方</span>
        <span style="flex:1"></span>
        <button type="button" class="btn btn-primary" onclick="submitProject()">创建项目</button>
          <button type="button" class="btn btn-outline" onclick="toggleAddForm()">取消</button>
      </div>
      <div id="partyPreview" style="margin-top:10px;display:flex;flex-direction:column;gap:4px;"></div>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <!-- 项目卡片列表 -->
  <div id="projectList" class="projects-grid"></div>
</div>

<script>
const API = 'http://127.0.0.1:8080';
const COLORS = ['#3b82f6','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ef4444','#ec4899','#6366f1'];
let _pendingParties = [];

function addParty() {
  const p = {
    name: document.getElementById('partyName').value.trim(),
    industry: document.getElementById('partyIndustry').value.trim(),
    parent: document.getElementById('partyParent').value.trim(),
    stock: document.getElementById('partyStock').value.trim(),
  };
  if (!p.name) return;
  _pendingParties.push(p);
  document.getElementById('partyName').value = '';
  document.getElementById('partyIndustry').value = '';
  document.getElementById('partyParent').value = '';
  document.getElementById('partyStock').value = '';
  renderPartyPreview();
}

function renderPartyPreview() {
  document.getElementById('partyCount').textContent = `已添加 ${_pendingParties.length} 个甲方`;
  document.getElementById('partyPreview').innerHTML = _pendingParties.map((p,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:6px;font-size:13px;">
      <span style="color:#64748b;">${i+1}.</span>
      <span style="font-weight:600;">${p.name}</span>
      ${p.industry ? `<span style="color:#64748b;font-size:11px;">🏭 ${p.industry}</span>` : ''}
      ${p.parent ? `<span style="color:#9d174d;font-size:11px;">母:${p.parent}</span>` : ''}
      ${p.stock ? `<span style="color:#166534;font-size:11px;">${p.stock}</span>` : ''}
      <span onclick="_pendingParties.splice(${i},1);renderPartyPreview()" style="margin-left:auto;cursor:pointer;color:#ef4444;font-size:16px;">×</span>
    </div>
  `).join('');
}

async function submitProject() {
  const debtor = {
    name: document.getElementById('debtorName').value.trim(),
    industry: document.getElementById('debtorIndustry').value.trim(),
    loan_amount: document.getElementById('debtorAmount').value.trim(),
    keywords: document.getElementById('debtorKW').value.trim(),
  };
  if (!debtor.name) { showMsg('请输入乙方企业名称', 'err'); return; }
  if (!_pendingParties.length) { showMsg('请至少添加一个甲方', 'err'); return; }

  let ok = 0;
  // 1. 创建乙方
  try {
    const r = await fetch(API+'/api/enterprises',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...debtor, role:'乙方'})});
    if ((await r.json()).status === 'ok') ok++;
  } catch(e) {}
  // 2. 创建甲方
  for (const p of _pendingParties) {
    try {
      const r = await fetch(API+'/api/enterprises',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:p.name, role:'甲方', industry:p.industry, debtor:debtor.name, parent:p.parent, parent_stock_code:p.stock, keywords:''})});
      if ((await r.json()).status === 'ok') ok++;
    } catch(e) {}
  }
  showMsg(`✅ 项目创建完成：${ok}家企业`, 'ok');
  document.getElementById('addCard').style.display = 'none';
  _pendingParties = []; renderPartyPreview();
  document.getElementById('debtorName').value = '';
  document.getElementById('debtorIndustry').value = '';
  document.getElementById('debtorAmount').value = '';
  document.getElementById('debtorKW').value = '';
  loadProjects();
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.textContent.includes(name === 'projects' ? '贷款' : '素材')); });
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.toggle('active', p.id === 'tab-' + name); });
  if (name === 'scrape') loadScrapeSources();
}

async function loadScrapeSources() {
  var tbody = document.getElementById('scrapeTableBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:40px;">加载中...</td></tr>';
  try {
    var resp = await fetch(API + '/api/scrape/sources?limit=100');
    var data = await resp.json();
    if (data.status !== 'ok' || !data.sources.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:40px;">暂无采集素材，等待首次采集完成</td></tr>';
      document.getElementById('scrapeStats').textContent = '';
      return;
    }
    var sources = data.sources;
    document.getElementById('scrapeStats').textContent = '共 ' + sources.length + ' 条';
    tbody.innerHTML = sources.map(function(s) {
      var dir = s.llm_direction;
      var dirClass = dir === 'positive' ? 'dir-pos' : (dir === 'negative' ? 'dir-neg' : 'dir-neu');
      var dirText = dir === 'positive' ? '利好' : (dir === 'negative' ? '利空' : '中性');
      var credHtml = s.credible === null
        ? '<button class="cred-btn up" onclick="markCredible(' + s.id + ',true)">👍</button><button class="cred-btn down" onclick="markCredible(' + s.id + ',false)">👎</button>'
        : (s.credible ? '<span class="cred-up">可信</span>' : '<span class="cred-down">不可信</span>');
      return '<tr>' +
        '<td style="white-space:nowrap;font-size:12px;color:#94a3b8;">' + (s.created_at || '').slice(0,16) + '</td>' +
        '<td style="font-size:11px;">' + (s.source || 'web') + '</td>' +
        '<td><a href="' + (s.source_url || '#') + '" target="_blank">' + (s.title || '').slice(0,50) + '</a></td>' +
        '<td style="font-size:12px;">' + (s.enterprise || '') + '</td>' +
        '<td><span class="' + dirClass + '">' + dirText + '</span></td>' +
        '<td>' + credHtml + '</td>' +
        '</tr>';
    }).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#dc2626;padding:40px;">加载失败</td></tr>';
  }
}

async function markCredible(id, val) {
  await fetch(API + '/api/scrape/sources/' + id + '/credible?credible=' + val, {method:'POST'});
  loadScrapeSources();
}

}

        <div id="addPartyForm_${encodeURIComponent(d.name)}" style="display:none;margin-top:8px;padding:12px;background:#f8fafc;border-radius:10px;border:1px dashed #cbd5e1;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input id="apName_${encodeURIComponent(d.name)}" placeholder="甲方企业全称 *" style="flex:2;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;">
            <input id="apIndustry_${encodeURIComponent(d.name)}" placeholder="行业" style="flex:1;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;">
            <input id="apParent_${encodeURIComponent(d.name)}" placeholder="母公司" style="flex:1;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;">
            <input id="apStock_${encodeURIComponent(d.name)}" placeholder="股票/概念代码" style="flex:1;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;">
            <button class="btn btn-primary" style="font-size:11px;padding:4px 12px;"
              onclick="event.stopPropagation();submitPartyTo('${d.name.replace(/'/g,"\'")}')">确认添加</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

}

function toggleAddForm() {
  const card = document.getElementById('addCard');
  const isHidden = card.style.display === 'none';
  card.style.display = isHidden ? 'block' : 'none';
  if (isHidden) card.scrollIntoView({behavior:'smooth'});
}
function toggleAll() {
  document.querySelectorAll('.project-card').forEach(c => c.classList.toggle('open'));
}

loadProjects();
