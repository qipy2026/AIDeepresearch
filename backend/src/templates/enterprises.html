<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贷款项目管理 - 贷后监管</title>
<link rel="stylesheet" href="/app/shared.css">
<style>
/* 业务特有样式 */
a.back { color:#93c5fd; font-size:13px; text-decoration:none; }

/* 项目网格 */
.projects-grid { display:flex; flex-direction:column; gap:20px; }
.project-card { background:var(--surface-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden; border-left:4px solid #e2e8f0; }
.project-card:nth-child(1) { border-left-color:#3b82f6; }
.project-card:nth-child(2) { border-left-color:#8b5cf6; }
.project-card:nth-child(3) { border-left-color:#06b6d4; }
.project-card:nth-child(4) { border-left-color:#f59e0b; }
.project-card:nth-child(5) { border-left-color:#10b981; }
.project-card:nth-child(6) { border-left-color:#ef4444; }
.project-card:nth-child(7) { border-left-color:#ec4899; }
.project-card:nth-child(8) { border-left-color:#6366f1; }

.project-head { padding:18px 22px; display:flex; align-items:center; gap:14px; cursor:pointer; user-select:none; }
.project-head:hover { background:#fafbfc; }
.project-body { padding:0 22px 16px 22px; border-top:1px solid #f1f5f9; display:none; }
.project-card.open .project-body { display:block; }
.project-head .num { width:36px; height:36px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff; }
.project-head .info { flex:1; }
.project-head .info .name { font-weight:700; font-size:15px; color:var(--text-primary); }
.project-head .info .meta { font-size:12px; color:var(--text-subtle); display:flex; gap:12px; margin-top:3px; }

.party-row { margin-left:36px; padding:10px 14px; background:#f8fafc; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.party-row + .party-row { margin-top:6px; }
.party-row .arrow { color:#94a3b8; margin-right:4px; }

.tag { display:inline-flex; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
.tag-debtor { background:#fef3c7; color:#92400e; }
.tag-party-a { background:#dbeafe; color:#1e40af; }
.tag-parent { background:#fce7f3; color:#9d174d; }
.tag-stock { background:#dcfce7; color:#166534; }

.btn-sm { padding:4px 10px; font-size:11px; border-radius:6px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; cursor:pointer; }

.add-card { background:var(--surface-card); border-radius:var(--radius-lg); padding:22px 24px; box-shadow:var(--shadow-card); border:2px dashed #cbd5e1; }
.add-card h2 { font-size:16px; margin-bottom:16px; color:var(--text-primary); }
.form-section { margin-bottom:14px; padding:14px; background:#f8fafc; border-radius:var(--radius-sm); }
.form-section h3 { font-size:13px; font-weight:700; margin-bottom:10px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; }
.form-field { flex:1; min-width:160px; }
.form-field label { display:block; font-size:11px; font-weight:600; color:#94a3b8; margin-bottom:3px; }
.form-field input, .form-field select { width:100%; padding:7px 10px; border:1px solid var(--border-medium); border-radius:7px; font-size:13px; background:var(--surface-card); }
.form-field input:focus, .form-field select:focus { outline:none; border-color:var(--color-primary-light); }
.hint { font-size:10px; color:#cbd5e1; margin-top:2px; }

.btn { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.btn-primary { background:var(--gradient-brand); color:#fff; }
.btn-primary:hover { opacity:.9; }
.btn-outline { background:transparent; border:1px solid var(--border-medium); color:var(--text-subtle); }
.btn-outline:hover { border-color:var(--color-primary-light); color:var(--color-primary-light); }

.msg { padding:8px 14px; border-radius:8px; font-size:13px; margin-top:10px; display:none; }
.msg.ok { display:block; background:#dcfce7; color:#166534; }
.msg.err { display:block; background:#fee2e2; color:#991b1b; }
.empty { text-align:center; padding:60px 20px; color:#94a3b8; }

.main-content > .inner { max-width:960px; }
</style>
</head>
<body>
<div class="layout-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="sidebar-title">贷后管理助手</h1>
          <p class="sidebar-subtitle">监控与预警系统</p>
        </div>
      </div>
    </div>
    <hr class="sidebar-divider">
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/app/">📋 贷后助手</a>
      <a class="sidebar-link" href="/warnings">⚠️ 预警中心</a>
      <a class="sidebar-link active" href="/enterprises">🏢 贷后项目</a>
      <a class="sidebar-link" href="/sources">📡 数据源管理</a>
      <a class="sidebar-link" href="/rag/upload">📄 参考文档</a>
      <a class="sidebar-link" href="/reports">📊 报告列表</a>
      <a class="sidebar-link" href="/reports-edit">✏️ 编辑报告</a>
    </nav>
    <hr class="sidebar-divider">
    <div class="sidebar-actions">
      <a class="btn-new-research" href="/app/">+ 开始新调查</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="inner">
      <div class="page-header">
        <h2 class="page-title">🏢 贷款项目管理</h2>
        <p class="page-subtitle">管理债务企业与核心企业关联关系 <span id="totalInfo" style="margin-left:8px;"></span></p>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;">
        <button class="btn btn-primary" onclick="toggleAddForm()" id="addBtn">➕ 新建项目</button>
        <button class="btn btn-outline" onclick="toggleAll()" style="font-size:12px;">展开/折叠全部</button>
      </div>

      <div class="add-card" id="addCard" style="display:none;">
        <h2>➕ 新建贷款项目</h2>
        <div class="form-section">
          <h3>🏢 乙方 — 债务企业（借款方）</h3>
          <div class="form-row">
            <div class="form-field" style="flex:2"><label>企业全称 *</label><input id="debtorName" placeholder="如：四川振海保安服务有限公司"></div>
            <div class="form-field"><label>行业</label><input id="debtorIndustry" placeholder="安保服务"></div>
            <div class="form-field"><label>贷款金额(万元)</label><input id="debtorAmount" type="number" placeholder="1000"></div>
            <div class="form-field" style="flex:2"><label>搜索关键词</label><input id="debtorKW" placeholder="逗号分隔"></div>
          </div>
        </div>
        <div class="form-section">
          <h3>📋 甲方 — 核心监管企业（可添加多个）</h3>
          <div class="form-row">
            <div class="form-field" style="flex:2"><label>企业全称 *</label><input id="partyName" placeholder="国家管网集团西南管道有限责任公司"></div>
            <div class="form-field"><label>行业</label><input id="partyIndustry" placeholder="管道运输"></div>
            <div class="form-field"><label>母公司</label><input id="partyParent" placeholder="国家管网集团"></div>
            <div class="form-field"><label>股票/概念代码</label><input id="partyStock" placeholder="601186.SH或885692.TI"></div>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
            <button type="button" class="btn btn-outline" onclick="addParty()">+ 添加此甲方</button>
            <span style="font-size:12px;color:#94a3b8;" id="partyCount">已添加 0 个甲方</span>
            <span style="flex:1"></span>
            <button type="button" class="btn btn-primary" onclick="submitProject()">创建项目</button>
            <button type="button" class="btn btn-outline" onclick="toggleAddForm()">取消</button>
          </div>
          <div id="partyPreview" style="margin-top:10px;display:flex;flex-direction:column;gap:4px;"></div>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div id="projectList" class="projects-grid"></div>
    </div>
  </main>
</div>

<script>
const API = 'http://127.0.0.1:8080';
const COLORS = ['#3b82f6','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ef4444','#ec4899','#6366f1'];
let _pendingParties = [];

function addParty() {
  const p = {
    name: document.getElementById('partyName').value.trim(),
    industry: document.getElementById('partyIndustry').value.trim(),
    parent: document.getElementById('partyParent').value.trim(),
    stock: document.getElementById('partyStock').value.trim(),
  };
  if (!p.name) return;
  _pendingParties.push(p);
  document.getElementById('partyName').value = '';
  document.getElementById('partyIndustry').value = '';
  document.getElementById('partyParent').value = '';
  document.getElementById('partyStock').value = '';
  renderPartyPreview();
}

function renderPartyPreview() {
  document.getElementById('partyCount').textContent = `已添加 ${_pendingParties.length} 个甲方`;
  document.getElementById('partyPreview').innerHTML = _pendingParties.map((p,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-card);border-radius:6px;font-size:13px;">
      <span style="color:var(--text-subtle);">${i+1}.</span>
      <span style="font-weight:600;">${p.name}</span>
      ${p.industry ? `<span style="color:var(--text-subtle);font-size:11px;">🏭 ${p.industry}</span>` : ''}
      ${p.parent ? `<span style="color:#9d174d;font-size:11px;">母:${p.parent}</span>` : ''}
      ${p.stock ? `<span style="color:#166534;font-size:11px;">${p.stock}</span>` : ''}
      <span onclick="_pendingParties.splice(${i},1);renderPartyPreview()" style="margin-left:auto;cursor:pointer;color:#ef4444;font-size:16px;">×</span>
    </div>
  `).join('');
}

async function submitProject() {
  const debtor = {
    name: document.getElementById('debtorName').value.trim(),
    industry: document.getElementById('debtorIndustry').value.trim(),
    loan_amount: document.getElementById('debtorAmount').value.trim(),
    keywords: document.getElementById('debtorKW').value.trim(),
  };
  if (!debtor.name) { showMsg('请输入乙方企业名称', 'err'); return; }
  if (!_pendingParties.length) { showMsg('请至少添加一个甲方', 'err'); return; }

  let ok = 0;
  try {
    const r = await fetch(API+'/api/enterprises',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...debtor, role:'乙方'})});
    if ((await r.json()).status === 'ok') ok++;
  } catch(e) {}
  for (const p of _pendingParties) {
    try {
      const r = await fetch(API+'/api/enterprises',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:p.name, role:'甲方', industry:p.industry, debtor:debtor.name, parent:p.parent, parent_stock_code:p.stock, keywords:''})});
      if ((await r.json()).status === 'ok') ok++;
    } catch(e) {}
  }
  showMsg(`✅ 项目创建完成：${ok}家企业`, 'ok');
  document.getElementById('addCard').style.display = 'none';
  _pendingParties = []; renderPartyPreview();
  document.getElementById('debtorName').value = '';
  document.getElementById('debtorIndustry').value = '';
  document.getElementById('debtorAmount').value = '';
  document.getElementById('debtorKW').value = '';
  loadProjects();
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + type;
  setTimeout(() => m.className = 'msg', 3000);
}

async function loadProjects() {
  const resp = await fetch(API + '/api/enterprises');
  const data = await resp.json();
  const all = data.enterprises || [];
  const debtors = all.filter(e => e.role === '乙方');
  const parties = all.filter(e => e.role === '甲方');

  if (!all.length) {
    document.getElementById('projectList').innerHTML = '<div class="empty"><p style="font-size:40px;margin-bottom:12px;">📋</p><p>暂无企业，请添加</p></div>';
    document.getElementById('totalInfo').textContent = '';
    return;
  }

  let html = '';
  debtors.forEach((d, i) => {
    const linked = parties.filter(p => p.debtor === d.name);
    html += `<div class="project-card open">
      <div class="project-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="num" style="background:${COLORS[i % COLORS.length]}">${i + 1}</div>
        <div class="info">
          <div class="name">${d.name}
            <span class="tag tag-debtor">乙方·债务企业</span>
          </div>
          <div class="meta">
            ${d.industry ? `<span>🏭 ${d.industry}</span>` : ''}
            ${d.loan_amount ? `<span>💰 ${d.loan_amount}万元</span>` : ''}
            <span>甲方 ${linked.length} 家</span>
          </div>
        </div>
        <button class="btn btn-sm" onclick="event.stopPropagation();deleteEnterprise('${d.name.replace(/'/g,"\\'")}')">删除</button>
      </div>
      <div class="project-body">
        ${linked.length ? linked.map(p => `
          <div class="party-row">
            <div style="flex:1;min-width:0;">
              <span class="arrow">└</span>
              <span style="font-weight:600;font-size:14px;">${p.name}</span>
              <span class="tag tag-party-a">甲方</span>
              ${p.parent ? `<span class="tag tag-parent">母公司 ${p.parent}</span>` : ''}
              ${p.parent_stock_code ? `<span class="tag tag-stock">${p.parent_stock_code}</span>` : ''}
              <div style="font-size:12px;color:var(--text-subtle);margin-top:3px;margin-left:18px;">🏭 ${p.industry || '未填行业'}</div>
            </div>
            <button class="btn btn-sm" onclick="deleteEnterprise('${p.name.replace(/'/g,"\\'")}')">删除</button>
          </div>
        `).join('') : '<div class="party-row" style="color:#94a3b8;">暂无关联甲方</div>'}
      </div>
    </div>`;
  });

  const unlinked = parties.filter(p => !p.debtor);
  if (unlinked.length) {
    html += `<div class="project-card open" style="border-left-color:#94a3b8;">
      <div class="project-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="num" style="background:#94a3b8;">!</div>
        <div class="info">
          <div class="name" style="color:var(--text-subtle);">📋 未关联的甲方（${unlinked.length}家）</div>
          <div class="meta">缺少债务企业绑定</div>
        </div>
      </div>
      <div class="project-body">
        ${unlinked.map(p => `
          <div class="party-row">
            <div style="flex:1;min-width:0;">
              <span style="font-weight:600;font-size:14px;">${p.name}</span>
              <span class="tag tag-party-a">甲方</span>
              ${p.parent ? `<span class="tag tag-parent">母公司 ${p.parent}</span>` : ''}
              <div style="font-size:12px;color:var(--text-subtle);margin-top:3px;">🏭 ${p.industry || '未填行业'}</div>
            </div>
            <button class="btn btn-sm" onclick="deleteEnterprise('${p.name.replace(/'/g,"\\'")}')">删除</button>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  document.getElementById('projectList').innerHTML = html;
  document.getElementById('totalInfo').textContent = '共 ' + debtors.length + ' 个项目，' + all.length + ' 家企业';
}

async function deleteEnterprise(name) {
  if (!confirm(`删除 ${name}？`)) return;
  await fetch(API + '/api/enterprises/' + encodeURIComponent(name), { method: 'DELETE' });
  loadProjects();
}

function toggleAddForm() {
  const card = document.getElementById('addCard');
  const isHidden = card.style.display === 'none';
  card.style.display = isHidden ? 'block' : 'none';
  if (isHidden) card.scrollIntoView({behavior:'smooth'});
}
function toggleAll() {
  document.querySelectorAll('.project-card').forEach(c => c.classList.toggle('open'));
}

loadProjects();
</script>
</body>
</html>
