<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>预警中心 - 贷后监管</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; }
.header { background: linear-gradient(135deg, #1e293b, #334155); color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 18px; font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.badge.red { background: #fecaca; color: #991b1b; }
.badge.orange { background: #fed7aa; color: #9a3412; }
.badge.yellow { background: #fef08a; color: #854d0e; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filters select, .filters input { padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; background: #fff; }
.filters label { font-size: 13px; color: #64748b; font-weight: 600; }
.stats-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 120px; padding: 16px 20px; border-radius: 14px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06); text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 800; }
.stat-card .label { font-size: 12px; color: #64748b; margin-top: 4px; }
.stat-card.red { border-left: 4px solid #ef4444; }
.stat-card.orange { border-left: 4px solid #f97316; }
.stat-card.yellow { border-left: 4px solid #eab308; }
.warning-list { display: flex; flex-direction: column; gap: 12px; }
.warning-card { background: #fff; border-radius: 14px; padding: 18px 22px; box-shadow: 0 2px 12px rgba(0,0,0,.06); display: flex; gap: 16px; align-items: flex-start; transition: box-shadow .2s; }
.warning-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); }
.warning-card.red { border-left: 5px solid #ef4444; }
.warning-card.orange { border-left: 5px solid #f97316; }
.warning-card.yellow { border-left: 5px solid #eab308; }
.sev-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
.warning-content { flex: 1; min-width: 0; }
.warning-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.warning-detail { font-size: 13px; color: #475569; line-height: 1.55; max-height: 60px; overflow: hidden; }
.warning-meta { display: flex; gap: 16px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: #94a3b8; }
.warning-meta span { display: flex; align-items: center; gap: 4px; }
.warning-actions { display: flex; gap: 8px; flex-shrink: 0; }
.warning-actions button { padding: 6px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 12px; cursor: pointer; background: #fff; transition: .15s; }
.warning-actions button.ack { border-color: #22c55e; color: #166534; }
.warning-actions button.ack:hover { background: #f0fdf4; }
.warning-actions button.false-btn { border-color: #f97316; color: #9a3412; }
.warning-actions button.false-btn:hover { background: #fff7ed; }
.status-acked { opacity: 0.6; }
.empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.auto-refresh { font-size: 12px; color: #64748b; }
.pulse { animation: pulse 1s; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.6 } }
.tag { display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600; }
.tag-green { background:#dcfce7;color:#166534; }
.tag-orange { background:#fff7ed;color:#9a3412; }
.tag-blue { background:#dbeafe;color:#1e40af; }
.sev-label { font-weight:600;font-size:12px; }
.detail-btn { padding:6px 14px;border-radius:8px;border:1px solid #3b82f6;font-size:12px;cursor:pointer;background:#eff6ff;color:#1d4ed8;transition:.15s; }
.detail-btn:hover { background:#dbeafe; }
.push-btn { padding:6px 14px;border-radius:8px;border:1px solid #7c3aed;font-size:12px;cursor:pointer;background:#f5f3ff;color:#6d28d9;transition:.15s; }
.push-btn:hover { background:#ede9fe; }
.factor-link { display:inline-block;padding:3px 10px;margin:2px 3px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;transition:.15s; }
.factor-link:hover { background:#3b82f6;color:#fff;border-color:#3b82f6; }
</style>
</head>
<body>

<div class="header">
  <span>🚨</span>
  <h1>预警中心</h1>
  <span id="totalBadge" class="badge red">0</span>
  <span style="flex:1"></span>
  <span class="auto-refresh" id="refreshInfo">自动刷新: 60s</span>
</div>

<div class="container">
  <div class="stats-row" id="statsRow"></div>

  <div class="filters">
    <label>企业:</label>
    <select id="filterEnterprise"><option value="">全部</option></select>
    <label>级别:</label>
    <select id="filterSeverity">
      <option value="">全部</option><option value="red">🔴 红色</option>
      <option value="orange">🟠 橙色</option><option value="yellow">🟡 黄色</option>
    </select>
    <button onclick="loadWarnings()" style="padding:8px 16px;border-radius:10px;border:1px solid #3b82f6;background:#eff6ff;color:#1d4ed8;cursor:pointer;font-weight:600;">刷新</button>
  </div>

  <div class="warning-list" id="warningList"></div>
</div>

<div id="detailModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.5);align-items:center;justify-content:center;padding:24px;" onclick="if(event.target===this)closeDetail()">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,.25);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:18px;">📋 风险明细</h3>
      <button onclick="closeDetail()" style="padding:6px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;">关闭</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div id="pushModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.5);align-items:center;justify-content:center;padding:24px;" onclick="if(event.target===this)closePush()">
  <div style="background:#fff;border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,.25);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:18px;">📤 推送预警到飞书</h3>
      <button onclick="closePush()" style="padding:6px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;">取消</button>
    </div>
    <label style="font-size:13px;font-weight:600;color:#1e293b;display:block;margin-bottom:6px;">发送到：</label>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <select id="pushChatSelect" style="flex:1;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;">
        <option value="">选择群聊...</option>
        <option value="__custom__">✏️ 手动输入 chat_id...</option>
      </select>
      <button onclick="loadChats()" style="padding:8px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;font-size:12px;" title="刷新群聊列表">🔄</button>
    </div>
    <input id="pushChatId" placeholder="或直接输入 chat_id (oc_xxx)" style="display:none;width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;margin-bottom:12px;" oninput="document.getElementById('pushChatSelect').value=this.value?'__custom__':''">
    <label style="font-size:13px;font-weight:600;color:#1e293b;display:block;margin-bottom:6px;">风险摘要：</label>
    <textarea id="pushSummary" style="width:100%;height:100px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;line-height:1.6;resize:vertical;font-family:inherit;margin-bottom:12px;"></textarea>
    <label style="font-size:13px;font-weight:600;color:#1e293b;display:block;margin-bottom:6px;">建议措施：</label>
    <textarea id="pushAction" style="width:100%;height:60px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;line-height:1.6;resize:vertical;font-family:inherit;"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
      <button onclick="closePush()" style="padding:8px 18px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;">取消</button>
      <button id="pushSendBtn" onclick="sendPush()" style="padding:8px 24px;border-radius:8px;border:none;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:600;cursor:pointer;">发送</button>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8080/api/warnings';

async function loadWarnings() {
  const ent = document.getElementById('filterEnterprise').value;
  const sev = document.getElementById('filterSeverity').value;
  let url = `${API}?limit=200`;
  if (ent) url += `&enterprise=${encodeURIComponent(ent)}`;
  if (sev) url += `&severity=${encodeURIComponent(sev)}`;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    renderWarnings(data.warnings || []);
    document.getElementById('refreshInfo').textContent = `最后更新: ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    console.error(err);
  }
}

async function loadStats() {
  try {
    const resp = await fetch(`${API}/stats`);
    const data = await resp.json();
    const bySev = data.by_severity || {};
    const total = Object.values(bySev).reduce((a,b) => a+b, 0);
    const statsRow = document.getElementById('statsRow');
    statsRow.innerHTML = `
      <div class="stat-card red"><div class="num">${bySev.red || 0}</div><div class="label">🔴 红色预警</div></div>
      <div class="stat-card orange"><div class="num">${bySev.orange || 0}</div><div class="label">🟠 橙色预警</div></div>
      <div class="stat-card yellow"><div class="num">${bySev.yellow || 0}</div><div class="label">🟡 黄色预警</div></div>
      <div class="stat-card"><div class="num">${total}</div><div class="label">合计预警</div></div>
    `;
    document.getElementById('totalBadge').textContent = total ? `${total}条` : '暂无';
  } catch (err) { console.error(err); }
}

function renderWarnings(warnings) {
  const list = document.getElementById('warningList');
  if (!warnings.length) {
    list.innerHTML = '<div class="empty"><div class="icon">✅</div><p>暂无预警，系统运行正常</p></div>';
    return;
  }
  list.innerHTML = warnings.map(w => {
    // 用户向风险摘要：标题是"企业 — 关键风险信号"，内容是可读摘要
    const riskTitle = w.title && !w.title.startsWith('{') ? w.title : (parseRawForTitle(w.raw_data) || w.enterprise);
    const riskSummary = parseDetail(w.detail);
    // 从 raw_data 提取可点击的风险因子列表
    let clickableFactors = '';
    try {
      const rd = JSON.parse(w.raw_data || '{}');
      const scans = rd['风险因子扫描'] || [];
      const items = scans.filter(s => s['条目数'] > 0).slice(0, 8);
      clickableFactors = items.map(s =>
        `<span class="factor-link" onclick="event.stopPropagation();showFactorDetail('${w.enterprise}','${s['风险因子']}','${s['明细工具']}',${s['条目数']})" title="点击查看${s['风险因子']}详情">${s['风险因子']}(${s['条目数']})</span>`
      ).join(' ');
    } catch(e) {}
    const sevLabel = {red:'🔴 红色预警', orange:'🟠 橙色预警', yellow:'🟡 黄色预警'}[w.severity] || w.severity;
    const statusHTML = w.status === 'false_positive'
      ? '<span class="tag tag-orange">已标记误报</span>'
      : '';
    const sevSelect = `<select onchange="setSeverity(${w.id}, this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid #cbd5e1;font-size:12px;cursor:pointer;" onclick="event.stopPropagation()">
      <option value="red" ${w.severity==='red'?'selected':''}>🔴 红色</option>
      <option value="orange" ${w.severity==='orange'?'selected':''}>🟠 橙色</option>
      <option value="yellow" ${w.severity==='yellow'?'selected':''}>🟡 黄色</option>
    </select>`;
    const pushBtn = (w.severity === 'red' || w.severity === 'orange')
      ? `<button class="push-btn" onclick="showPush(${w.id},'${w.enterprise}','${w.severity}','${escapeHtml(w.title||'')}','${escapeHtml(w.detail||'')}')">📤 推送</button>`
      : '';
    const actionsHTML = w.status === 'false_positive'
      ? `<div class="warning-actions"><button onclick="unfalseWarning(${w.id})" style="padding:6px 12px;border-radius:8px;border:1px solid #94a3b8;font-size:12px;cursor:pointer;background:#fff;color:#64748b;">↩ 撤销误报</button><button class="detail-btn" onclick="showDetail(${w.id})">明细</button></div>`
      : `<div class="warning-actions"><button class="false-btn" onclick="falseWarning(${w.id})">标记误报</button>${sevSelect}${pushBtn}<button class="detail-btn" onclick="showDetail(${w.id})">明细</button></div>`;
    return `
    <div class="warning-card ${w.severity}" id="w-${w.id}">
      <div class="sev-icon">${w.severity === 'red' ? '🔴' : w.severity === 'orange' ? '🟠' : '🟡'}</div>
      <div class="warning-content">
        <div class="warning-title">${riskTitle}</div>
        <div class="warning-detail">${clickableFactors || riskSummary}</div>
        <div class="warning-meta">
          <span class="sev-label">${sevLabel}</span>
          <span>📡 ${w.source}</span>
          <span>🕐 ${(w.created_at||'').slice(0,16)}</span>
          ${statusHTML}
        </div>
      </div>
      ${actionsHTML}
    </div>
  `}).join('');

  // Populate enterprise filter
  const seen = new Set();
  const sel = document.getElementById('filterEnterprise');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>';
  warnings.forEach(w => { if (!seen.has(w.enterprise)) { seen.add(w.enterprise); sel.innerHTML += `<option value="${w.enterprise}">${w.enterprise}</option>`; }});
  sel.value = cur;
}

async function falseWarning(id) {
  try {
    await fetch(`${API}/${id}/false`, { method: 'PUT', headers: { 'X-API-Key': 'warning-dev-key-2026' } });
    setTimeout(loadWarnings, 400);
  } catch (err) { console.error(err); }
}

async function unfalseWarning(id) {
  try {
    await fetch(`${API}/${id}/unfalse`, { method: 'PUT', headers: { 'X-API-Key': 'warning-dev-key-2026' } });
    setTimeout(loadWarnings, 400);
  } catch (err) { console.error(err); }
}

async function setSeverity(id, severity) {
  try {
    await fetch(`${API}/${id}/severity`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': 'warning-dev-key-2026' },
      body: JSON.stringify({ severity })
    });
    setTimeout(loadWarnings, 400);
  } catch (err) { console.error(err); }
}

async function showDetail(id) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailBody');
  body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="generating-spinner"></div><p>查询明细中...</p></div>';
  modal.style.display = 'flex';
  try {
    const resp = await fetch(`${API}/${id}/detail`);
    const data = await resp.json();
    let html = '';

    // 企业 + 数据源
    html += `<p style="margin:0 0 12px;"><b>${data.enterprise}</b> | 数据源: ${data.source} | 预警ID: ${data.warning_id}</p>`;

    // 解析错误
    if (data.parse_error) {
      html += `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:12px;">
        <b style="color:#dc2626;">⚠️ raw_data JSON 解析失败:</b> ${data.parse_error}</div>`;
    }

    // 风险因子列表（含工具名）
    if (data.factors && data.factors.length) {
      html += `<h4 style="margin:12px 0 8px;">风险因子 (有记录)</h4>`;
      html += data.factors.map(f => `
        <div style="padding:8px 12px;background:#fff;border-radius:8px;margin:4px 0;border:1px solid #e2e8f0;">
          ${f.name}: <b>${f.count}条</b>
          ${f.tool ? `<span style="color:#3b82f6;font-size:12px;">→ 调用了 <code>${f.tool}</code></span>` : ''}
          ${f.raw_preview ? `<pre style="white-space:pre-wrap;font-size:11px;color:#64748b;margin:4px 0 0;">${f.raw_preview}</pre>` : ''}
        </div>
      `).join('');
    }

    // 明细结果
    if (data.details && data.details.length) {
      html += `<h4 style="margin:12px 0 8px;">明细查询结果</h4>`;
      html += data.details.map(d => `
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:12px;">
          <h4 style="margin:0 0 4px;color:#1e293b;">${d.factor} (${d.count}条)
            <span style="font-weight:normal;font-size:12px;color:#3b82f6;">调用: <code>${d.tool_called || 'N/A'}</code></span>
          </h4>
          ${d.error ? `<p style="color:#dc2626;font-size:12px;">错误: ${d.error}</p>` : ''}
          ${d.content ? `<pre style="white-space:pre-wrap;font-size:12px;line-height:1.6;color:#334155;max-height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:6px;">${d.content}</pre>` : ''}
          ${d.raw_response ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:#64748b;">📡 原始返回</summary><pre style="white-space:pre-wrap;font-size:11px;color:#94a3b8;max-height:200px;overflow-y:auto;">${d.raw_response}</pre></details>` : ''}
        </div>
      `).join('');
    }

    if (!data.factors?.length && !data.details?.length) {
      html += '<p style="color:#64748b;">无可用数据</p>';
    }

    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = `<p style="color:#dc2626;">查询失败: ${err.message}</p>`;
  }
}

function closeDetail() {
  document.getElementById('detailModal').style.display = 'none';
}

async function showFactorDetail(enterprise, factor, tool, count) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailBody');
  body.innerHTML = `<div style="text-align:center;padding:20px;">查询 ${factor}(${count}) 中...</div>`;
  modal.style.display = 'flex';
  document.querySelector('#detailModal h3').textContent = `📋 ${factor} — ${enterprise}`;
  try {
    const params = new URLSearchParams({enterprise, tool, factor});
    const resp = await fetch('http://127.0.0.1:8080/api/warnings/factor?' + params);
    const data = await resp.json();
    body.innerHTML = `
      <p style="font-size:13px;color:#64748b;margin:0 0 8px;">调用工具: <code>${data.tool}</code> | ${data.factor}: <b>${count}条</b></p>
      ${data.error ? `<p style="color:#dc2626;">错误: ${data.error}</p>` : ''}
      ${data.content ? `<pre style="white-space:pre-wrap;font-size:12px;line-height:1.6;color:#334155;max-height:400px;overflow-y:auto;background:#f8fafc;padding:12px;border-radius:8px;">${data.content}</pre>` : ''}
      ${data.raw ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:#64748b;">📡 原始返回</summary><pre style="white-space:pre-wrap;font-size:11px;color:#94a3b8;max-height:200px;overflow-y:auto;">${data.raw}</pre></details>` : ''}
    `;
  } catch(e) {
    body.innerHTML = `<p style="color:#dc2626;">查询失败: ${e.message}</p>`;
  }
}

let _pushId = null;
async function loadChats() {
  const sel = document.getElementById('pushChatSelect');
  sel.innerHTML = '<option value="">加载中...</option>';
  try {
    const resp = await fetch('http://127.0.0.1:8080/api/feishu/chats');
    const data = await resp.json();
    sel.innerHTML = '<option value="">选择群聊...</option>';
    (data.chats||[]).forEach(c => {
      sel.innerHTML += `<option value="${c.chat_id}">${c.name || c.chat_id}</option>`;
    });
    sel.innerHTML += '<option value="__custom__">✏️ 手动输入 chat_id...</option>';
  } catch(e) { sel.innerHTML = '<option value="">加载失败，请手动输入</option><option value="__custom__">✏️ 手动输入</option>'; }
}
let _pushData = null;
function showPush(id, enterprise, severity, title, detail) {
  _pushData = { id, enterprise, severity };
  const cleanDetail = (detail || '').replace(/已全量扫描.*?。/, '').replace(/各因子明细请调用其.*/g, '').trim();
  // 预填卡片内容（用户可编辑摘要和措施）
  document.getElementById('pushSummary').value = cleanDetail || title || '';
  document.getElementById('pushAction').value = severity === 'red'
    ? '🚨 请立即核实，必要时启动风险应对流程'
    : '📋 请关注并在24小时内完成评估';
  document.getElementById('pushChatId').style.display = 'none';
  document.getElementById('pushChatId').value = localStorage.getItem('last_feishu_chat_id') || '';
  loadChats();
  document.getElementById('pushModal').style.display = 'flex';
  document.getElementById('pushChatSelect').onchange = function() {
    const custom = document.getElementById('pushChatId');
    if (this.value === '__custom__') { custom.style.display = 'block'; custom.focus(); }
    else { custom.style.display = 'none'; }

function escapeHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function parseDetail(text) {
  if (!text) return '暂无详情';
  try {
    const obj = JSON.parse(text);
    // 企查查格式
    if (obj['摘要']) return obj['摘要'];
    if (obj['风险因子扫描']) {
      const active = obj['风险因子扫描'].filter(f => f['条目数'] > 0).map(f => `${f['风险因子']}(${f['条目数']})`);
      return active.length ? active.join('、') : '无异常';
    }
    return text;
  } catch {
    // Already human-readable
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }
}

function parseRawForTitle(rawData) {
  if (!rawData) return '';
  try {
    const obj = JSON.parse(rawData);
    if (obj['企业名称']) return obj['企业名称'];
  } catch {}
  return '';
}

function truncate(text, max) {
  if (!text) return '';
  // First try parsed detail
  return parseDetail(text).slice(0, max);
}
