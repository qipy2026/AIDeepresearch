<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据源管理 - 贷后监管</title>
<link rel="stylesheet" href="/app/shared.css">
<style>
/* 业务特有样式 */
.toolbar { display:flex; gap:10px; margin-bottom:16px; align-items:center; }
.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.btn-primary { background:var(--gradient-brand); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border-medium); color:var(--text-subtle); }
.btn-sm { padding:4px 8px; font-size:11px; border-radius:5px; cursor:pointer; border:1px solid var(--border-medium); }

table { width:100%; border-collapse:collapse; background:var(--surface-card); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-card); }
th { background:#f8fafc; text-align:left; padding:12px 14px; font-size:12px; font-weight:700; color:var(--text-subtle); border-bottom:2px solid var(--border-medium); }
td { padding:10px 14px; font-size:13px; border-bottom:1px solid #f1f5f9; }
tr:hover { background:#fafbfc; }

.tag { display:inline-block; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:600; }
.tag-macro { background:#dbeafe; color:#1e40af; }
.tag-report { background:#dcfce7; color:#166534; }
.tag-opinion { background:#fef3c7; color:#92400e; }
.tag-commerce { background:#fce7f3; color:#9d174d; }
.tag-movie { background:#e0e7ff; color:#3730a3; }
.tag-rank { background:#fef2f2; color:#991b1b; }
.tag-stock { background:#e0f2fe; color:#075985; }

.toggle { width:40px; height:22px; border-radius:11px; border:none; cursor:pointer; transition:background .2s; }
.toggle.on { background:#16a34a; }
.toggle.off { background:#cbd5e1; }
.toggle::after { content:''; display:block; width:18px; height:18px; border-radius:50%; background:var(--surface-card); margin:2px; transition:transform .2s; }
.toggle.on::after { transform:translateX(18px); }

.modal { display:none; position:fixed; inset:0; z-index:9999; background:rgba(15,23,42,.5); align-items:center; justify-content:center; padding:24px; }
.modal.open { display:flex; }
.modal-box { background:var(--surface-card); border-radius:16px; padding:24px; max-width:500px; width:100%; box-shadow:var(--shadow-modal); }
.modal-box h3 { margin-bottom:16px; }
.form-row { display:flex; gap:10px; margin-bottom:10px; }
.form-field { flex:1; }
.form-field label { display:block; font-size:11px; font-weight:600; color:#94a3b8; margin-bottom:3px; }
.form-field input, .form-field select { width:100%; padding:7px 10px; border:1px solid var(--border-medium); border-radius:7px; font-size:13px; }
.msg { padding:8px 14px; border-radius:8px; font-size:13px; margin-top:10px; display:none; }
.msg.ok { display:block; background:#dcfce7; color:#166534; }
.msg.err { display:block; background:#fee2e2; color:#991b1b; }

.main-content > .inner { max-width:1100px; }
</style>
</head>
<body>
<div class="layout-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="sidebar-title">贷后管理助手</h1>
          <p class="sidebar-subtitle">监控与预警系统</p>
        </div>
      </div>
    </div>
    <hr class="sidebar-divider">
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/app/">📋 贷后助手</a>
      <a class="sidebar-link" href="/warnings">⚠️ 预警中心</a>
      <a class="sidebar-link" href="/enterprises">🏢 贷后项目</a>
      <a class="sidebar-link active" href="/sources">📡 数据源管理</a>
      <a class="sidebar-link" href="/rag/upload">📄 参考文档</a>
      <a class="sidebar-link" href="/reports">📊 报告列表</a>
      <a class="sidebar-link" href="/reports-edit">✏️ 编辑报告</a>
    </nav>
    <hr class="sidebar-divider">
    <div class="sidebar-actions">
      <a class="btn-new-research" href="/app/">+ 开始新调查</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="inner">
      <div class="page-header">
        <h2 class="page-title">📡 数据源管理</h2>
        <p class="page-subtitle">管理数据采集源与采集频率 <span id="statusMsg" style="margin-left:8px;"></span></p>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" onclick="openAdd()">+ 新增数据源</button>
        <button class="btn btn-outline" onclick="saveAll()">💾 保存修改</button>
      </div>

      <table>
        <thead>
          <tr><th>状态</th><th>名称</th><th>URL</th><th>分类</th><th>采集频率</th><th>builtin</th><th>操作</th></tr>
        </thead>
        <tbody id="sourceTable"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal" id="editModal">
  <div class="modal-box">
    <h3 id="modalTitle">新增数据源</h3>
    <div class="form-row">
      <div class="form-field" style="flex:2"><label>名称 *</label><input id="sName"></div>
      <div class="form-field"><label>分类</label>
        <select id="sCategory">
          <option value="宏观数据">宏观数据</option><option value="行业报告">行业报告</option>
          <option value="舆情指数">舆情指数</option><option value="电商流量">电商流量</option>
          <option value="影视票房">影视票房</option><option value="行业排名">行业排名</option><option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field" style="flex:2"><label>URL *</label><input id="sUrl"></div>
      <div class="form-field"><label>采集频率</label>
        <select id="sSchedule"><option value="daily">每日</option><option value="weekly">每周</option><option value="monthly">每月</option></select>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="document.getElementById('editModal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" onclick="saveSource()">确定</button>
    </div>
    <div id="editMsg" class="msg"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8080';
let sources = [];
let editIndex = -1;

const CAT_TAGS = {
  '宏观数据': 'macro', '行业报告': 'report', '舆情指数': 'opinion',
  '电商流量': 'commerce', '影视票房': 'movie', '行业排名': 'rank',
  '上市公司公告': 'stock', '其他': 'macro'
};

async function loadSources() {
  const resp = await fetch(API + '/api/sources');
  const data = await resp.json();
  sources = data.sources || [];
  render();
}

function render() {
  const tbody = document.getElementById('sourceTable');
  tbody.innerHTML = sources.map((s, i) => {
    const tag = CAT_TAGS[s.category] || 'macro';
    const builtin = s.builtin ? '🔒' : '';
    return `<tr>
      <td><button class="toggle ${s.enabled ? 'on' : 'off'}" onclick="toggleSource(${i})"></button></td>
      <td>${s.name}</td>
      <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><a href="${s.url}" target="_blank" style="color:var(--color-primary-light);">${s.url}</a></td>
      <td><span class="tag tag-${tag}">${s.category}</span></td>
      <td>${s.schedule === 'daily' ? '每日' : s.schedule === 'weekly' ? '每周' : '每月'}</td>
      <td>${builtin}</td>
      <td>
        <button class="btn-sm" onclick="openEdit(${i})">编辑</button>
        ${s.builtin ? '' : `<button class="btn-sm" style="color:#dc2626;border-color:#fecaca;background:#fef2f2;" onclick="deleteSource(${i})">删除</button>`}
      </td>
    </tr>`;
  }).join('');
}

function toggleSource(i) {
  sources[i].enabled = !sources[i].enabled;
  render();
  document.getElementById('statusMsg').textContent = '状态已修改，请点击「保存修改」';
}

function openAdd() {
  editIndex = -1;
  document.getElementById('modalTitle').textContent = '新增数据源';
  document.getElementById('sName').value = '';
  document.getElementById('sUrl').value = '';
  document.getElementById('sCategory').value = '其他';
  document.getElementById('sSchedule').value = 'daily';
  document.getElementById('editModal').classList.add('open');
}

function openEdit(i) {
  editIndex = i;
  const s = sources[i];
  document.getElementById('modalTitle').textContent = '编辑数据源';
  document.getElementById('sName').value = s.name;
  document.getElementById('sUrl').value = s.url;
  document.getElementById('sCategory').value = s.category;
  document.getElementById('sSchedule').value = s.schedule;
  document.getElementById('editModal').classList.add('open');
}

function saveSource() {
  const name = document.getElementById('sName').value.trim();
  const url = document.getElementById('sUrl').value.trim();
  if (!name || !url) {
    document.getElementById('editMsg').className = 'msg err';
    document.getElementById('editMsg').textContent = '名称和 URL 不能为空';
    return;
  }
  const entry = { name, url, category: document.getElementById('sCategory').value, schedule: document.getElementById('sSchedule').value, enabled: true };
  if (editIndex >= 0) {
    entry.enabled = sources[editIndex].enabled;
    if (sources[editIndex].builtin) entry.builtin = true;
    sources[editIndex] = entry;
  } else {
    sources.push(entry);
  }
  document.getElementById('editModal').classList.remove('open');
  render();
  document.getElementById('statusMsg').textContent = '已修改，请点击「保存修改」';
}

function deleteSource(i) {
  if (!confirm('删除 ' + sources[i].name + '？')) return;
  sources.splice(i, 1);
  render();
  document.getElementById('statusMsg').textContent = '已修改，请点击「保存修改」';
}

async function saveAll() {
  try {
    const resp = await fetch(API + '/api/sources', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sources})
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('statusMsg').textContent = '✅ 保存成功，下次采集周期生效';
    }
  } catch(e) { document.getElementById('statusMsg').textContent = '保存失败'; }
}

loadSources();
</script>
</body>
</html>
