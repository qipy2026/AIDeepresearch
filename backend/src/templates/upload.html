<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业参考文档 - 贷后监管</title>
<style>
  * { box-sizing: border-box; }
.header { background: linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:14px 28px; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:18px; font-weight:700; margin:0; color:#fff; }
.nav-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; transition: all .2s; white-space: nowrap; }
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
.nav-link.current { color: #fff; background: rgba(255,255,255,0.15); font-weight: 700; }
  body { font-family: -apple-system, sans-serif; background: #f1f5f9; margin: 0; padding: 24px; }
  .container { max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 20px; color: #0f172a; }
  .desc { color: #64748b; font-size: 14px; margin: 0 0 20px; }
  .upload-area { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: .2s; background: #f8fafc; }
  .upload-area:hover, .upload-area.dragover { border-color: #3b82f6; background: #eff6ff; }
  .upload-area.has-file { border-color: #22c55e; background: #f0fdf4; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { color: #475569; font-size: 14px; }
  .upload-hint { color: #94a3b8; font-size: 12px; margin-top: 6px; }
  .upload-progress { margin-top: 12px; display: none; }
  .upload-progress.active { display: block; }
  .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; width: 0; transition: width .3s; }
  .progress-text { font-size: 13px; color: #64748b; margin-top: 6px; }
  .msg { padding: 10px 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; display: none; }
  .msg.ok { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .section-title { font-size: 14px; font-weight: 600; color: #1e293b; margin: 20px 0 10px; }
  .ent-list { display: flex; flex-direction: column; gap: 8px; }
  .ent-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
  .ent-name { font-size: 14px; font-weight: 500; color: #0f172a; }
  .ent-info { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .btn-del { padding: 4px 12px; border-radius: 6px; border: 1px solid #fca5a5; background: #fff; color: #dc2626; font-size: 12px; cursor: pointer; transition: .2s; }
  .btn-del:hover { background: #fee2e2; }
  .empty { color: #94a3b8; font-size: 13px; text-align: center; padding: 20px; }
.nav-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; transition: all .2s; white-space: nowrap; }
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
.nav-link.current { color: #fff; background: rgba(255,255,255,0.15); font-weight: 700; }
</style>
</head>
<body>
<div class="header"><a href="/warnings" style="color:#fff;text-decoration:none;font-weight:800;font-size:14px;margin-right:12px;white-space:nowrap;">贷后监管</a><span>📄</span><h1>参考文档</h1>  <span style="flex:1"></span>
  <a href="/enterprises" class="nav-link ">贷款项目</a>
  <a href="/sources" class="nav-link ">数据源管理</a>
  <a href="/rag/upload" class="nav-link current">参考文档</a>
  <a href="/app" class="nav-link " target="_blank">贷后助手</a>
</div>
<div class="container">
  <div class="card">
    <h1>📄 企业参考文档</h1>
    <p class="desc">上传企业的工商、票据、风险数据文档，自动嵌入向量库供 RAG 检索</p>

    <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon" id="uploadIcon">📤</div>
      <div class="upload-text" id="uploadText">点击选择文件或拖拽到此处</div>
      <div class="upload-hint" id="uploadHint">支持 .md .docx .pdf .html .txt</div>
      <input type="file" id="fileInput" accept=".md,.docx,.pdf,.html,.htm,.txt" multiple style="display:none">
      <div class="upload-progress" id="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">上传中...</div>
      </div>
    </div>
    <div class="msg" id="msg"></div>

    <div class="section-title">已上传企业</div>
    <div class="ent-list" id="entList"><div class="empty">加载中...</div></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropArea = document.getElementById('dropArea');
const uploadText = document.getElementById('uploadText');
const uploadHint = document.getElementById('uploadHint');
const uploadIcon = document.getElementById('uploadIcon');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const msg = document.getElementById('msg');
const entList = document.getElementById('entList');

// 拖拽
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => { handleFiles(fileInput.files); });

function extractEnterprise(filename) {
  let name = filename.replace(/\.[^.]+$/, '');
  for (const sep of [' - ', ' – ', ' _ ', '_', '-']) {
    if (name.includes(sep)) return name.split(sep)[0].trim();
  }
  return name.trim();
}

async function handleFiles(files) {
  if (!files || files.length === 0) return;
  const total = files.length;
  uploadText.textContent = files[0].name + (total > 1 ? ' 等 ' + total + ' 个文件' : '');
  uploadHint.textContent = '共 ' + total + ' 个文件，开始上传...';
  uploadIcon.textContent = '⏳';
  dropArea.classList.add('has-file');
  progress.classList.add('active');
  showMsg('', '');
  let ok = 0, err = 0;

  for (let i = 0; i < total; i++) {
    const file = files[i];
    const pct = Math.round((i / total) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = '上传中 ' + (i + 1) + '/' + total + '：' + file.name;

    const enterprise = extractEnterprise(file.name);
    const fd = new FormData();
    fd.append('enterprise', enterprise);
    fd.append('file', file);

    try {
      const resp = await fetch('/rag/upload/file', { method: 'POST', body: fd });
      const data = await resp.json();
      if (resp.ok) { ok++; } else { err++; }
    } catch { err++; }
  }

  progressFill.style.width = '100%';
  progressText.textContent = '✅ 完成 ' + ok + '/' + total + '，失败 ' + err;
  uploadIcon.textContent = ok > 0 ? '✅' : '❌';
  if (ok > 0) refreshList();
  setTimeout(() => { progress.classList.remove('active'); }, 4000);
}

async function deleteEnt(enterprise) {
  if (!confirm('确认删除 "' + enterprise + '" 的所有数据？')) return;
  try {
    const resp = await fetch('/rag/enterprise/' + encodeURIComponent(enterprise), { method: 'DELETE' });
    if (resp.ok) refreshList();
    else alert('删除失败');
  } catch {}
}

async function refreshList() {
  try {
    const resp = await fetch('/rag/enterprises');
    const data = await resp.json();
    const list = data.enterprises || [];
    if (list.length === 0) { entList.innerHTML = '<div class="empty">暂无已上传企业</div>'; return; }
    entList.innerHTML = list.map(e =>
      '<div class="ent-row"><div><div class="ent-name">' + e + '</div></div><button class="btn-del" onclick="deleteEnt(\'' + e.replace(/'/g, "\\'") + '\')">删除</button></div>'
    ).join('');
  } catch { entList.innerHTML = '<div class="empty">加载失败</div>'; }
}

function showMsg(text, type) { msg.textContent = text; msg.className = 'msg' + (type ? ' ' + type : ''); }

refreshList();
</script>
</body>
</html>
