<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业参考文档 - 贷后监管</title>
<link rel="stylesheet" href="/app/shared.css">
<style>
/* 业务特有样式 */
.card { background:var(--surface-card); border-radius:16px; padding:28px; box-shadow:var(--shadow-card); }
h1 { margin: 0 0 6px; font-size: 20px; color: var(--text-primary); }
.desc { color: var(--text-subtle); font-size: 14px; margin: 0 0 20px; }
.upload-area { border: 2px dashed var(--border-medium); border-radius:var(--radius-md); padding: 40px 20px; text-align: center; cursor: pointer; transition: .2s; background:#f8fafc; }
.upload-area:hover, .upload-area.dragover { border-color: var(--color-primary-light); background: #eff6ff; }
.upload-area.has-file { border-color: #22c55e; background: #f0fdf4; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-text { color: var(--text-muted); font-size: 14px; }
.upload-hint { color: #94a3b8; font-size: 12px; margin-top: 6px; }
.upload-progress { margin-top: 12px; display: none; }
.upload-progress.active { display: block; }
.progress-bar { width: 100%; height: 6px; background: var(--border-medium); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gradient-action); border-radius: 3px; width: 0; transition: width .3s; }
.progress-text { font-size: 13px; color: var(--text-subtle); margin-top: 6px; }
.msg { padding: 10px 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; display: none; }
.msg.ok { display: block; background: #dcfce7; color: #166534; }
.msg.err { display: block; background: #fee2e2; color: #991b1b; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text-body); margin: 20px 0 10px; }
.ent-list { display: flex; flex-direction: column; gap: 8px; }
.ent-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f8fafc; border-radius:var(--radius-sm); border: 1px solid var(--border-medium); }
.ent-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.ent-info { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.btn-del { padding: 4px 12px; border-radius: 6px; border: 1px solid #fca5a5; background: var(--surface-card); color: #dc2626; font-size: 12px; cursor: pointer; transition: .2s; }
.btn-del:hover { background: #fee2e2; }
.empty { color: #94a3b8; font-size: 13px; text-align: center; padding: 20px; }

.main-content > .inner { max-width:640px; }
</style>
</head>
<body>
<div class="layout-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="sidebar-title">贷后管理助手</h1>
          <p class="sidebar-subtitle">监控与预警系统</p>
        </div>
      </div>
    </div>
    <hr class="sidebar-divider">
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/app/">📋 贷后助手</a>
      <a class="sidebar-link" href="/warnings">⚠️ 预警中心</a>
      <a class="sidebar-link" href="/enterprises">🏢 贷后项目</a>
      <a class="sidebar-link" href="/sources">📡 数据源管理</a>
      <a class="sidebar-link active" href="/rag/upload">📄 参考文档</a>
      <a class="sidebar-link" href="/reports">📊 报告列表</a>
      <a class="sidebar-link" href="/reports-edit">✏️ 编辑报告</a>
    </nav>
    <hr class="sidebar-divider">
    <div class="sidebar-actions">
      <a class="btn-new-research" href="/app/">+ 开始新调查</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="inner">
      <div class="page-header">
        <h2 class="page-title">📄 参考文档</h2>
        <p class="page-subtitle">上传企业文档，自动嵌入向量库供 RAG 检索</p>
      </div>

      <div class="card">
        <h1>📄 企业参考文档</h1>
        <p class="desc">上传企业的工商、票据、风险数据文档，自动嵌入向量库供 RAG 检索</p>

        <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon" id="uploadIcon">📤</div>
          <div class="upload-text" id="uploadText">点击选择文件或拖拽到此处</div>
          <div class="upload-hint" id="uploadHint">支持 .md .docx .pdf .html .txt</div>
          <input type="file" id="fileInput" accept=".md,.docx,.pdf,.html,.htm,.txt" multiple style="display:none">
          <div class="upload-progress" id="progress">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">上传中...</div>
          </div>
        </div>
        <div class="msg" id="msg"></div>

        <div class="section-title">已上传企业</div>
        <div class="ent-list" id="entList"><div class="empty">加载中...</div></div>
      </div>
    </div>
  </main>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropArea = document.getElementById('dropArea');
const uploadText = document.getElementById('uploadText');
const uploadHint = document.getElementById('uploadHint');
const uploadIcon = document.getElementById('uploadIcon');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const msg = document.getElementById('msg');
const entList = document.getElementById('entList');

dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => { handleFiles(fileInput.files); });

function extractEnterprise(filename) {
  let name = filename.replace(/\.[^.]+$/, '');
  for (const sep of [' - ', ' – ', ' _ ', '_', '-']) {
    if (name.includes(sep)) return name.split(sep)[0].trim();
  }
  return name.trim();
}

async function handleFiles(files) {
  if (!files || files.length === 0) return;
  const total = files.length;
  uploadText.textContent = files[0].name + (total > 1 ? ' 等 ' + total + ' 个文件' : '');
  uploadHint.textContent = '共 ' + total + ' 个文件，开始上传...';
  uploadIcon.textContent = '⏳';
  dropArea.classList.add('has-file');
  progress.classList.add('active');
  showMsg('', '');
  let ok = 0, err = 0;

  for (let i = 0; i < total; i++) {
    const file = files[i];
    const pct = Math.round((i / total) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = '上传中 ' + (i + 1) + '/' + total + '：' + file.name;

    const enterprise = extractEnterprise(file.name);
    const fd = new FormData();
    fd.append('enterprise', enterprise);
    fd.append('file', file);

    try {
      const resp = await fetch('/rag/upload/file', { method: 'POST', body: fd });
      const data = await resp.json();
      if (resp.ok) { ok++; } else { err++; }
    } catch { err++; }
  }

  progressFill.style.width = '100%';
  progressText.textContent = '✅ 完成 ' + ok + '/' + total + '，失败 ' + err;
  uploadIcon.textContent = ok > 0 ? '✅' : '❌';
  if (ok > 0) refreshList();
  setTimeout(() => { progress.classList.remove('active'); }, 4000);
}

async function deleteEnt(enterprise) {
  if (!confirm('确认删除 "' + enterprise + '" 的所有数据？')) return;
  try {
    const resp = await fetch('/rag/enterprise/' + encodeURIComponent(enterprise), { method: 'DELETE' });
    if (resp.ok) refreshList();
    else alert('删除失败');
  } catch {}
}

async function refreshList() {
  try {
    const resp = await fetch('/rag/enterprises');
    const data = await resp.json();
    const list = data.enterprises || [];
    if (list.length === 0) { entList.innerHTML = '<div class="empty">暂无已上传企业</div>'; return; }
    entList.innerHTML = list.map(e =>
      '<div class="ent-row"><div><div class="ent-name">' + e + '</div></div><button class="btn-del" onclick="deleteEnt(\'' + e.replace(/'/g, "\\'") + '\')">删除</button></div>'
    ).join('');
  } catch { entList.innerHTML = '<div class="empty">加载失败</div>'; }
}

function showMsg(text, type) { msg.textContent = text; msg.className = 'msg' + (type ? ' ' + type : ''); }

refreshList();
</script>
</body>
</html>
