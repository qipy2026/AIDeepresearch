[project]
name = "aideepresearch"
version = "0.1.0"
description = "AIDeepresearch - deep research assistant (LangGraph + LangChain)."
authors = [
    { name = "Lance Martin" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.5.0",
    "python-dotenv==1.0.1",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "uvicorn[standard]>=0.32.0",
    "ddgs>=9.6.1",
    "loguru>=0.7.3",
    "chromadb>=0.5.0",
    "crawl4ai>=0.1.0",
    "minio>=7.2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "pymysql>=1.1.1",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
